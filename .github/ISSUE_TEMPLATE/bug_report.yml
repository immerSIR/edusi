name: Bug report
description: Report a reproducible problem in Edusi.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, routes, test data, or screenshots where useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, Python version, or deployment target.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs with secrets redacted.
      render: shell
