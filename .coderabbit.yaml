# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be direct, concise, and prioritize correctness, security, regressions, accessibility, and missing tests."

reviews:
  profile: assertive
  request_changes_workflow: true
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  high_level_summary: true
  assess_linked_issues: true
  enable_prompt_for_ai_agents: true
  in_progress_fortune: false
  poem: false
  path_filters:
    - "!frontend/.next/**"
    - "!frontend/coverage/**"
    - "!coverage/**"
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!docs/_site/**"
  path_instructions:
    - path: "frontend/src/**"
      instructions: "Review Next.js and React changes for accessibility, state handling, loading and error states, responsive UI regressions, API integration mistakes, and focused frontend test coverage."
    - path: "backend/app/**"
      instructions: "Review FastAPI backend changes for authorization, input validation, error handling, database query safety, external API failure modes, and focused pytest coverage."
    - path: "supabase/**"
      instructions: "Treat Supabase schema, RLS, seed data, and Edge Function changes as security-sensitive. Flag broad policies, unsafe service-role usage, missing ownership checks, and migration risks."
    - path: ".github/workflows/**"
      instructions: "Treat workflow changes as security-sensitive. Flag broad token permissions, unsafe use of secrets, untrusted pull request code running with privileged triggers, missing environment protection for deployments, and unpinned or unexpected third-party actions."
    - path: "frontend/package*.json"
      instructions: "Review dependency changes for supply-chain risk, lockfile consistency, runtime compatibility, and whether CI still uses the repository's supported Node version."
    - path: "backend/requirements*.txt"
      instructions: "Review dependency changes for supply-chain risk, lockfile or version-range risk, runtime compatibility, and whether backend tests cover changed behavior."
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - "main"
    ignore_title_keywords:
      - "[skip review]"
      - "[wip]"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
  tools:
    semgrep:
      enabled: true
    opengrep:
      enabled: true
    trivy:
      enabled: true
    osvScanner:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    actionlint:
      enabled: true
    eslint:
      enabled: true
    pylint:
      enabled: true

chat:
  allow_non_org_members: false
  auto_reply: false

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
